name: Deploy Website to GoDaddy via FTP

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    steps:
    - name: Get latest code
      uses: actions/checkout@v4
      with:
        fetch-depth: 2

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build Project
      run: npm run build

    - name: Sync changed files via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        port: 21
        local-dir: ./out/
        server-dir: public_html/
        # dangerous-clean-slate: true wipes the remote public_html/ on every deploy
        # and uploads the full build fresh.  This prevents the "550 Can't change
        # directory" FTP error that occurs when the saved sync-state references a
        # stale _next/<hash>/ folder that was deleted from the server between runs.
        # Switch to false (and re-add state-name) only if deploy times become a
        # concern and the server is never manually modified between deployments.
        dry-run: false
        dangerous-clean-slate: false
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
